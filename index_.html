<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>轉發之後｜無主持人劇本殺</title>
<meta name="theme-color" content="#12151c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=LXGW+WenKai+TC:wght@400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>/* 轉發之後 — 介面風格
   預設：霧面玻璃。[data-theme="collage"] 拼貼雜訊；[data-theme="social"] 現代社群（深色簡約）
   色票：#0D0D10 深色基底／#18181D 卡片／#F2F2F4 文字／#FF3B5C 警示重點／#5B7CFF 按鈕連結 */
:root{
  --bg:#141a28;
  --bg-art:radial-gradient(50% 38% at 12% 8%,#5b7cff5c,transparent 70%),radial-gradient(45% 32% at 92% 22%,#ff3b5c38,transparent 70%),radial-gradient(60% 45% at 45% 98%,#3fc2b24a,transparent 70%),linear-gradient(170deg,#243049,#121724);
  --panel:rgba(255,255,255,.075); --panel2:rgba(255,255,255,.11); --line:rgba(255,255,255,.15); --text:#F2F2F4; --muted:#a9b2c6;
  --accent:#5B7CFF; --accent2:#7f96ff; --accent-ink:#fff; --danger:#FF3B5C; --ok:#35c98a;
  --sys:#a9b9ff; --sys-glow:#5B7CFF;
  --h-a:#ffb020; --h-b:#5B7CFF; --h-c:#FF3B5C; --h-d:#a57bff; --h-e:#35c98a;
  --card:rgba(246,247,251,.9); --ink:#1b1d24; --paper-muted:#6b7080; --paper-rule:rgba(40,50,80,.06); --stamp:#e0304f;
  --r:22px; --r-sm:14px; --bw:1px; --shadow:0 20px 50px -26px rgba(0,0,0,.7);
  --glass:blur(22px) saturate(1.35);
  --display:"Noto Serif TC","Songti TC",serif; --display-w:600;
  --hand:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --inbg:rgba(0,0,0,.22); --warnbg:rgba(255,59,92,.1); --topbg:rgba(20,26,40,.55); --dotbg:rgba(255,255,255,.09); --okbg:rgba(53,201,138,.18); --tabbg:rgba(18,23,36,.62);
  --sysbg:rgba(91,124,255,.14); --sysline:rgba(169,185,255,.32); --soft:rgba(91,124,255,.18); --msgbg:rgba(255,255,255,.1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
body{min-height:100%;background:var(--bg-art),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 128px}
h1,h2,h3{font-family:var(--display);line-height:1.35;margin:0 0 .5em;text-wrap:balance;font-weight:700}
h1{font-size:clamp(2.2rem,10vw,3rem);letter-spacing:.08em;font-weight:var(--display-w)}
h2{font-size:1.3rem;letter-spacing:.04em}
h3{font-size:1.02rem;display:flex;align-items:center;gap:.45em;letter-spacing:.03em}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.pre{white-space:pre-line}
.center{text-align:center}
.hidden{display:none!important}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}

/* ---------- 按鈕、輸入、容器 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:var(--bw) solid var(--line);background:var(--panel2);border-radius:var(--r-sm);padding:.7em 1.1em;cursor:pointer;min-height:46px;text-align:center;font-weight:600;letter-spacing:.04em;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent;box-shadow:0 12px 26px -12px var(--accent)}
.btn.outline{background:transparent;border-color:rgba(255,255,255,.4)}
.btn.ghost{background:transparent}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06140d}
.btn.block{display:flex;width:100%}
.btn.small{min-height:34px;padding:.3em .8em;font-size:.85rem}
.input{width:100%;background:var(--inbg);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:.72em .9em;min-height:46px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
select.input{appearance:auto}
textarea.input{font-family:var(--hand);font-size:1.02rem;line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.card,.post,.feed,.pick,.loc{backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.card{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),var(--shadow)}
.paper{background:var(--card);color:var(--ink);border-radius:var(--r);padding:20px 20px 22px;box-shadow:var(--shadow);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.paper h2,.paper h3{color:var(--ink)}
.paper h3{border-bottom:1px solid color-mix(in srgb,var(--ink) 15%,transparent);padding-bottom:.35em}
.paper .muted{color:var(--paper-muted)}
.code{font-family:var(--mono);font-size:2.4rem;letter-spacing:.3em;font-weight:700;color:#fff;text-shadow:0 0 24px var(--accent)}
.tag{display:inline-block;font-size:.75rem;padding:.12em .7em;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.acc{border-color:var(--accent);color:var(--accent2)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.warn{border-left:3px solid var(--danger);padding:12px 14px;background:var(--warnbg);border-radius:4px var(--r-sm) var(--r-sm) 4px}
.series{font-family:var(--mono);color:var(--muted);font-size:.72rem;letter-spacing:.24em}

/* ---------- LIVE 燈、色塊圖示、跳動數字 ---------- */
.live{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;font-weight:700;color:#fff;background:var(--danger);padding:.12em .55em .12em .45em;border-radius:6px;vertical-align:.15em;box-shadow:0 0 14px -2px color-mix(in srgb,var(--danger) 70%,transparent)}
.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.chip{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;flex:none;color:#fff;box-shadow:0 6px 16px -8px var(--hc),inset 0 1px 0 rgba(255,255,255,.35);background:linear-gradient(145deg,color-mix(in srgb,var(--hc) 88%,#fff),color-mix(in srgb,var(--hc) 80%,#000))}
.chip .ic{width:22px;height:22px}
.chip.sm{width:30px;height:30px;border-radius:9px}.chip.sm .ic{width:17px;height:17px}
.h-a{--hc:var(--h-a)}.h-b{--hc:var(--h-b)}.h-c{--hc:var(--h-c)}.h-d{--hc:var(--h-d)}.h-e{--hc:var(--h-e)}
.rp-tick{display:inline-block;animation:tick .5s ease-out}
@keyframes tick{from{transform:translateY(-6px);opacity:.2}to{transform:none;opacity:1}}
.up{color:var(--danger);font-weight:700}

/* ---------- 首頁：正在被轉發的貼文 ---------- */
.appbar{display:grid;grid-template-columns:32px 1fr auto auto;align-items:center;gap:10px;padding:6px 0 12px}
.appbar b{font-family:var(--display);font-size:1.12rem;text-align:center;letter-spacing:.08em}
.appbar .ab-time{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.ab-ic{display:inline-flex;color:var(--text)}.ab-ic .ic{width:22px;height:22px}
.post{position:relative;background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),var(--shadow)}
.post-hd{display:flex;align-items:center;gap:10px}
.post-hd .ph{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);color:var(--muted);flex:none}
.post-hd .ph .ic{width:22px;height:22px}
.post-hd b{font-size:.92rem}
.post-hd .no{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.post-hd .ab-ic{margin-left:auto;color:var(--muted)}
.post-title{font-size:1.5rem;margin:14px 0;font-weight:500;letter-spacing:.1em;line-height:1.5}
.sens{position:relative;display:block;width:100%;aspect-ratio:16/10;max-width:100%;border:0;padding:0;border-radius:var(--r-sm);overflow:hidden;cursor:pointer;background:#222;color:#fff}
.blur-img{position:absolute;inset:-24px;filter:blur(16px) saturate(.85);background:
  radial-gradient(20% 36% at 30% 45%,#caa18a,transparent 70%),radial-gradient(17% 32% at 57% 40%,#b38e79,transparent 70%),radial-gradient(19% 34% at 80% 50%,#9c7a68,transparent 70%),
  radial-gradient(60% 40% at 50% 100%,#2e3440,transparent 70%),linear-gradient(160deg,#4a4f5c,#20232b 60%,#3a2f2a)}
.sens::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 7px,transparent 7px 14px),repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 7px,transparent 7px 14px);mix-blend-mode:multiply}
.sens-in{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:12px;background:rgba(10,12,20,.3)}
.sens-in .ic{width:30px;height:30px}
.sens-in b{font-size:1rem;letter-spacing:.06em}
.sens-in span{font-size:.78rem;opacity:.8}
.sens-btn{margin-top:6px;padding:.3em 1em;border-radius:8px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);opacity:1!important;font-weight:600}
.sens.seen .sens-in{background:rgba(120,10,30,.45)}
.stats{display:flex;gap:18px;align-items:center;margin:14px 2px 4px;font-family:var(--mono);font-size:.9rem;color:var(--muted)}
.stats span{display:inline-flex;align-items:center;gap:6px}
.stats .st-rp{color:var(--danger)}.stats .st-rp .ic{width:1.4em;height:1.4em}
.stats .st-vw{margin-left:auto}
.stats .lbl{display:none}
.cmts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cm-row{display:flex;align-items:flex-start;gap:10px}
.cm-row img{width:32px;height:32px;border-radius:50%;flex:none;background:var(--line)}
.cm-b{background:var(--panel2);border-radius:4px 14px 14px 14px;padding:6px 12px;display:flex;flex-direction:column;line-height:1.4;max-width:78%}
.cm-b b{font-size:.74rem;color:var(--muted);font-weight:600}
.cm-b span{font-size:.92rem}
.cm-row time{font-family:var(--mono);font-size:.66rem;color:var(--muted);align-self:flex-end}
.cm-row.in,.fr.in{animation:slidein .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.plus1{display:flex;align-items:center;gap:10px;margin-top:14px;padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);font-size:.9rem;width:fit-content;max-width:100%}
.plus1>.ic{color:var(--danger)}
.plus1 .p1{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-family:var(--mono);font-weight:700;font-size:.72rem;color:#fff;background:var(--danger);box-shadow:0 0 14px var(--danger)}
.plus1.pop .p1{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.intro{padding:22px 4px 6px}
.intro h1{margin:6px 0 2px}
.intro .tg{font-family:var(--display);font-size:1.2rem;letter-spacing:.08em;margin:0 0 14px}
.intro .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.82rem;color:var(--muted)}
.intro .meta span{display:inline-flex;align-items:center;gap:5px}

/* LIVE 動態列（首頁的轉發、遊戲裡的房間動態）*/
.feed{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px 16px;margin-top:12px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.feed-hd{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-bottom:4px}
#feed{display:flex;flex-direction:column}
.fr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.feed-hd+.fr,#feed .fr:first-child{border-top:0}
.fr img{width:32px;height:32px;border-radius:50%;flex:none;background:var(--line)}
.fr-b{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.fr-b b{font-size:.78rem;font-weight:600}
.fr-b span{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-b .fr-t{color:var(--text);white-space:normal}
.fr time{font-family:var(--mono);font-size:.66rem;color:var(--muted);flex:none}

/* ---------- 遊戲內 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--topbg);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;padding:10px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top .act{font-family:var(--display);font-weight:700;font-size:1.08rem;letter-spacing:.06em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gstat{display:inline-flex;gap:10px;font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-left:2px}
.gstat span{display:inline-flex;align-items:center;gap:3px}
.gstat .g-rp{color:var(--danger)}
.acts{max-width:560px;margin:0 auto;padding:0 16px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.acts span{height:3px;border-radius:2px;background:var(--line)}
.acts span.done{background:color-mix(in srgb,var(--accent) 60%,transparent)}
.acts span.on{background:linear-gradient(90deg,var(--danger),var(--accent));box-shadow:0 0 10px var(--accent)}
.dots{display:flex;gap:6px;flex-wrap:wrap;max-width:560px;margin:0 auto;padding:0 16px 10px}
.dot{font-size:.72rem;padding:.12em .6em;border-radius:99px;background:var(--dotbg);color:var(--muted)}
.dot.ready{background:var(--okbg);color:var(--ok)}
.dot.off{opacity:.45;text-decoration:line-through}
.dot.me{outline:1px solid var(--accent);color:var(--text)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--tabbg);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:9px 2px 11px;color:var(--muted);font-size:.74rem;cursor:pointer;position:relative;min-height:58px}
.tabs button b{display:block;line-height:1;font-weight:400}
.tabs button .ic{width:22px;height:22px;display:block;margin:0 auto 4px}
.tabs button.t-book{--tc:var(--h-a)}.tabs button.t-search{--tc:var(--h-b)}.tabs button.t-clues{--tc:var(--h-c)}.tabs button.t-tl{--tc:var(--h-d)}.tabs button.t-msg,.tabs button.t-vote,.tabs button.t-end{--tc:var(--h-e)}
.tabs button.on{color:var(--tc)}
.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--tc);box-shadow:0 0 12px var(--tc);border-radius:0 0 2px 2px}
.tabs button.on b{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--tc) 60%,transparent))}
.badge{position:absolute;top:6px;right:22%;background:var(--danger);color:#fff;border-radius:99px;font-size:.65rem;padding:0 .45em;min-width:1.4em}

/* 小織 */
.sys{display:flex;gap:12px;align-items:flex-start;background:var(--sysbg);border:1px solid var(--sysline);border-radius:20px 20px 20px 6px;padding:13px 15px;position:relative;overflow:hidden;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.sys .av{flex:none;width:32px;height:32px;margin-top:2px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fff,var(--sys) 38%,var(--sys-glow) 80%);box-shadow:0 0 14px var(--sys-glow);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 26px var(--sys-glow),0 0 2px #fff;transform:scale(1.06)}}
.sys .nm{color:var(--sys);font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;font-weight:700}
.sys .nm::after{content:" · 校園助手";font-weight:400;opacity:.6}

/* 搜證地點 */
.loc{display:flex;align-items:center;gap:14px;background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.loc.locked .chip{filter:grayscale(1);opacity:.5}
.act-prompt{border:1px dashed var(--accent);border-radius:var(--r-sm);padding:12px 14px;background:var(--soft)}

/* 證物（線索）*/
.clue{position:relative;border-radius:18px;color:var(--ink);padding:14px 16px 14px 18px;background:var(--card);box-shadow:var(--shadow);border-left:5px solid var(--h-a);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.clue:nth-child(5n+2){border-left-color:var(--h-b)}.clue:nth-child(5n+3){border-left-color:var(--h-c)}.clue:nth-child(5n+4){border-left-color:var(--h-d)}.clue:nth-child(5n+5){border-left-color:var(--h-e)}
.clue .ev{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;color:var(--paper-muted);margin-bottom:4px}
.clue .ev .evno{color:var(--ink);font-weight:700;border:1px solid color-mix(in srgb,var(--ink) 35%,transparent);padding:0 .45em;border-radius:4px}
.clue .t{font-weight:700;font-family:var(--display);font-size:1.08rem;padding-right:64px;letter-spacing:.03em}
.clue .muted{color:var(--paper-muted)}
.clue .meta{font-family:var(--mono);font-size:.7rem;color:var(--paper-muted);margin-top:8px}
.clue.pub .stamp{position:absolute;top:12px;right:10px;transform:rotate(-8deg);border:2px solid var(--stamp);color:var(--stamp);font-weight:900;font-size:.8rem;letter-spacing:.25em;padding:.05em .45em .05em .7em;border-radius:4px;opacity:.85}
.rub{position:relative;width:100%;height:120px;border-radius:10px;overflow:hidden;background:#f6f1e4;touch-action:none;user-select:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.rub .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font-family:var(--hand);font-size:1.15rem;color:#2e2618}
.rub canvas{position:absolute;inset:0;width:100%;height:100%}

/* 時間線 */
.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;padding:10px 4px 12px;border-bottom:1px dashed var(--line)}
.tl .it:last-child{border-bottom:0}
.tl .tm{font-family:var(--mono);font-size:.9rem;color:var(--accent2);padding-top:2px}
.tl .tm::before{content:"● ";color:var(--danger);font-size:.6rem;vertical-align:2px}
.tl .pre{font-family:var(--hand);font-size:1.05rem;line-height:1.55}
.conf{font-size:.7rem;padding:.03em .55em;border-radius:99px;border:1px solid var(--line)}
.conf.c2{border-color:var(--ok);color:var(--ok)}.conf.c1{border-color:var(--accent);color:var(--accent2)}.conf.c0{color:var(--muted)}

/* 私訊、結局 */
.msg{max-width:85%;padding:10px 14px;border-radius:18px 18px 18px 4px;background:var(--msgbg);font-family:var(--hand);font-size:1.05rem;line-height:1.55}
.msg.me{align-self:flex-end;border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink)}
.glitch{font-family:var(--mono);color:#ff8a8a;letter-spacing:.06em;animation:gl 2.2s infinite}
@keyframes gl{0%,100%{opacity:1}47%{opacity:1;text-shadow:none}49%{opacity:.25;transform:translateX(2px);text-shadow:-2px 0 #6cf,2px 0 #f66}51%{opacity:1;transform:none}}
.log{font-size:.82rem;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.qr{background:#fff;padding:12px;border-radius:14px;display:inline-block}
.qr img,.qr svg{display:block;width:180px;height:180px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(10,12,20,.9);border:1px solid rgba(255,255,255,.15);color:#fff;padding:.6em 1.1em;border-radius:99px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px);text-align:center;backdrop-filter:blur(10px)}
.pre.small{font-family:var(--hand);font-size:1rem}

/* 推播橫幅 */
#banners{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.banner{pointer-events:auto;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;max-width:440px;padding:10px 12px;border-radius:20px;background:rgba(30,36,52,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px -14px rgba(0,0,0,.7);color:#F2F2F4;animation:drop .5s cubic-bezier(.2,.9,.25,1.2)}
.banner.out{transition:transform .35s,opacity .35s;transform:translateY(-120%);opacity:0}
.banner .chip{width:36px;height:36px;border-radius:10px}.banner .chip .ic{width:20px;height:20px}
.bn-body{flex:1;min-width:0}
.bn-hd{display:flex;justify-content:space-between;font-size:.72rem;color:#a9b2c6}
.bn-hd b{color:#fff;letter-spacing:.06em}
.bn-tx{font-size:.9rem;line-height:1.4}
@keyframes drop{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}

/* 頭像、角色、投票 */
.av-wrap{position:relative;flex:none;display:inline-block}
.av-wrap svg{display:block;border-radius:50%}
.av-badge{position:absolute;right:-2px;bottom:-2px;display:flex;align-items:center;justify-content:center;background:#1b2130;border:2px solid #1b2130;border-radius:50%;line-height:1}
.av-wrap img,.av-fb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.av-fb{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.pick{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;color:var(--text)}
.pick.mine{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 10px 30px -18px var(--accent);background:var(--soft)}
.pick.taken{opacity:.45;cursor:not-allowed}
.pk-name{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.05em}
.pk-by{color:var(--muted);margin-top:4px}
.pick.mine .pk-by{color:var(--accent2)}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vopt{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--inbg);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:12px 4px;cursor:pointer;color:var(--text);font-size:.85rem}
.vopt.on{border-color:var(--accent);background:var(--soft);color:var(--accent2)}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avopt{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--inbg);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:10px 2px 8px;cursor:pointer;color:var(--text);font-size:.72rem;transition:border-color .2s,transform .15s}
.avopt:hover:not(:disabled){transform:translateY(-2px)}
.avopt.on{border-color:var(--accent);background:var(--soft);color:var(--accent2)}
.avopt:disabled{opacity:.3;cursor:not-allowed}
details summary{cursor:pointer}

/* 風格選擇 */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.themes button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);border:var(--bw) solid var(--line);background:var(--inbg);cursor:pointer;font-size:.8rem;color:var(--text)}
.themes button i{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid rgba(128,128,128,.4)}
.themes button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}

}

[data-theme="collage"] .stats{flex-wrap:wrap}

[data-theme="collage"] .intro .meta .ic{display:none}
[data-theme="collage"] .btn{border-radius:3px;backdrop-filter:none}

[data-theme="collage"] .btn.outline{border-color:#f1ede4}
[data-theme="collage"] .clue{border-radius:2px;border-left:0;background:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(0,0,0,.05) 27px 28px),var(--card);transform:rotate(-.5deg)}

  const LOC_LOOK = { office: ["door", "a"], access: ["eye", "b"], cloud: ["phone", "d"], board: ["megaphone", "c"], report: ["shield", "e"] };
  const CLUE = {}, CLUE_NO = {}; { let n = 0; G.locations.forEach((l) => l.clues.forEach((c) => (CLUE_NO[c.id] = ++n))); }
   G.locations.forEach((l) => l.clues.forEach((c) => (CLUE[c.id] = { ...c, loc: l.id, locName: l.name })));
  const PHASE_NAME = { lobby: "等待玩家", pick: "選擇角色", 0: "讀本", 1: "第一幕・自我介紹", 2: "第二幕・搜證", 3: "第三幕・搜證與對質", 4: "第四幕・投票", 5: "結局" };

  /* ---------------- claude.ai 內建即時房間（room capability） ----------------
     claude.ai 會擋 WebRTC，所以在 claude.ai 裡改走平台的 room：

  let ROOM_P = null;
  function getRoom() {
    if (ROOM_P) return ROOM_P;
    ROOM_P = (async () => {
      for (let i = 0; i < 50 && !(window.claude && typeof window.claude.use === "function"); i++) await new Promise((r) => setTimeout(r, 100));
      if (!(window.claude && typeof window.claude.use === "function")) { ROOM_DIAG = "R1 找不到 claude 介面（" + (IN_FRAME ? "框架內" : "獨立分頁") + "）"; return null; }
      let R = null;
      try { R = await window.claude.use("room"); } catch (e) { ROOM_DIAG = "R2 use 失敗：" + (e && (e.code || e.message)); return null; }
      if (!R) {
        let st = "?";
        try { const P = await window.claude.use("permissions"); if (P) st = await P.state("room"); } catch (e) { st = "err"; }
        ROOM_DIAG = "R3 平台沒有提供 room（權限狀態：" + st + "；" + (IN_FRAME ? "框架內" : "獨立分頁") + "）";
      }
      return R;
    })();
    return ROOM_P;
  }
  let ROOM_DIAG = "";
  const roomNA = () => ROOM_NA + (ROOM_DIAG ? "　［診斷碼：" + ROOM_DIAG + "］" : "");
  const ROOM_NA = "連不上 claude.ai 的即時房間：請確認你已登入 Claude，而且開房者有在「分享」裡邀請你到這個頁面（只拿到公開連結的人無法加入）。";
  const b64e = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const b64d = (s) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  async function packObj(o) {
    const u = new TextEncoder().encode(JSON.stringify(o));
    if (window.CompressionStream) { try { const z = new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer()); return "z" + b64e(z); } catch (e) {} }
    return "j" + b64e(u);
  }
  async function unpackObj(s) {
    let u = b64d(s.slice(1));
    if (s[0] === "z") u = new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
    return JSON.parse(new TextDecoder().decode(u));
  }
  async function joinGameRoom(R, code) {
    try { return { r: await R.join("larp-" + String(code).toLowerCase().replace(/[^a-z0-9_.-]/g, "")), lobby: false }; }
    catch (e) { return { r: R, lobby: true }; }
  }

  function roomHostTransport(code, onMsg, onOpen, onError) {
    let r = null, sid = 0, lastPack = null, flushT = null, dead = false;
    const you = {}, seenJoin = new Map(), lastN = new Map(), acks = new Map();
    let pendingState = null;
    const emitState = async () => {
      if (!r || !pendingState) return;
      const S = pendingState; pendingState = null;
      sid++; const id = sid;
      const d = await packObj(S);
      const n = Math.ceil(d.length / 3000) || 1;
      lastPack = { id, d, n };
      sendPack();
    };
    const sendPack = () => {
      if (!r || !lastPack) return;
      const { id, d, n } = lastPack;
      for (let i = 0; i < n; i++) r.emit("st", { c: code, id, i, n, d: d.slice(i * 3000, (i + 1) * 3000), you: i === 0 ? you : undefined }).catch((e) => {
        if (e && e.code === "not_permitted" && !dead) { dead = true; onError("只有這個頁面的擁有者或編輯者可以在 claude.ai 開房。請改由擁有者開房，其他人用房間代號加入。"); }
      });
    };
    const handlePeers = (ch) => {
      for (const p of [...ch.joined, ...ch.updated]) {
        if (p.sameTab || p.kind !== "viewer") continue;
        const pr = p.presence || {};
        if (pr.c !== code) continue;
        if (pr.join && typeof pr.join === "object") {
          const k = JSON.stringify(pr.join);
          if (seenJoin.get(p.peer) !== k) { seenJoin.set(p.peer, k); lastN.set(p.peer, 0); onMsg(p.peer, { t: "join", name: String(pr.join.name || ""), token: String(pr.join.token || "") }); }
        }
        if (Array.isArray(pr.out)) {
          let last = lastN.get(p.peer) || 0;
          for (const m of pr.out) if (m && typeof m.n === "number" && m.n > last && m.x && typeof m.x === "object") { last = m.n; onMsg(p.peer, m.x); }
          lastN.set(p.peer, last);
        }
        if (pr.ack != null) acks.set(p.peer, pr.ack);
      }
      for (const p of ch.left) {
        if (seenJoin.has(p.peer)) { seenJoin.delete(p.peer); lastN.delete(p.peer); acks.delete(p.peer); delete you[p.peer]; onMsg(p.peer, { t: "bye" }); }
      }
    };
    (async () => {
      const R = await getRoom();
      if (!R) { onError(roomNA()); return; }
      const g = await joinGameRoom(R, code); r = g.r;
      r.presence({ c: code, host: 1 }).catch(() => {});
      r.onPeers(handlePeers, (e) => onError(ROOM_NA + "（" + e.code + "）"));
      let dcT = null; r.onConnection((ok) => { clearTimeout(dcT); if (!ok) dcT = setTimeout(() => onError("與 claude.ai 的連線中斷，正在重連…"), 2500); else onError(""); });
      onOpen();
      setInterval(() => { if (lastPack && [...seenJoin.keys()].some((pe) => acks.get(pe) !== lastPack.id)) sendPack(); }, 3000);
    })();
    return {
      send: (id, x) => {
        if (!x) return;
        if (x.t === "state") { you[id] = x.you; pendingState = x.s; clearTimeout(flushT); flushT = setTimeout(emitState, 120); return; }
        if (r) r.emit("er", { c: code, to: id, x }).catch(() => {});
      },
      ids: () => [...seenJoin.keys()],
      drop: (id) => { seenJoin.delete(id); },
    };
  }

  function roomClientTransport(code, onMsg, onOpen, onClose) {
    let r = null, n = 0, out = [], join = null, myPeer = null, hostPeer = null, closed = false, gotState = false;
    const parts = new Map();

      if (!r) return;

      r.presence({ c: code, join, out }).catch(() => {});
    };
    (async () => {
      const R = await getRoom();
      if (!R) { onClose(roomNA()); return; }
      const g = await joinGameRoom(R, code); r = g.r;

      r.onPeers((ch) => {
        const me = ch.peers.find((p) => p.sameTab); if (me) myPeer = me.peer;
        if (hostPeer && ch.left.some((p) => p.peer === hostPeer)) { hostPeer = null; gotState = false; onClose("開房者離開了房間，等他回來會自動接上…"); }
      }, (e) => onClose(ROOM_NA + "（" + e.code + "）"));

        let P = parts.get(d.id); if (!P) { P = { n: d.n, got: [], you: null }; parts.set(d.id, P); }
        P.got[d.i] = d.d; if (d.you) P.you = d.you;
        if (P.got.filter((x) => x != null).length !== P.n) return;
        for (const k of [...parts.keys()]) if (k <= d.id) parts.delete(k);
        if (!P.you || !myPeer || !P.you[myPeer]) return;

          const S = await unpackObj(P.got.join(""));

    })();

      send: (x) => {
        if (!x) return;
        if (x.t === "join") { join = { name: x.name, token: x.token, k: uid() }; out = []; push(); return; }
        out.push({ n: ++n, x }); push();

      close: () => { closed = true; try { if (r) { r.presence({ c: null, join: null, out: null }).catch(() => {}); if (r.leave) r.leave().catch(() => {}); } } catch (e) {} },
    };
  }

  function makeHostTransport(code, onMsg, onOpen, onError) {
    if (IN_FRAME && !LOCAL) return roomHostTransport(code, onMsg, onOpen, onError);
    const conns = new Map(); // connId -> {send}
    if (LOCAL) {
      const bc = new BroadcastChannel("larp-" + code);
      bc.onmessage = (e) => { const m = e.data; if (m.to !== "host") return; if (!conns.has(m.from)) conns.set(m.from, { send: (x) => bc.postMessage({ to: m.from, data: x }) }); onMsg(m.from, m.data); };
      setTimeout(onOpen, 10);

    }
    let peer, tries = 0;
    if (!rtcSupported()) { setTimeout(() => { onError(RTC_MSG); rtcHelp(); }, 10); return { send: () => {}, ids: () => [], drop: () => {} }; }
    const open = () => {

      peer.on("connection", (c) => {

        c.on("data", (d) => onMsg(id, d));

  function makeClientTransport(code, onMsg, onOpen, onClose) {

  /* ---------------- host logic ---------------- */
  let HOST = null; // {S, t, connPid}
  function newState(code) {
    return { v: 1, code, names: {}, letters: {}, avatars: {}, phase: "lobby", players: [], deck: {}, clues: {}, timeline: [], votes: {}, hints: 0, hope: { shown: false, replied: false }, log: [], hostPid: null };
  }
  function hostStart(code, name, restore) {
    const S = restore || newState(code);
    const connPid = new Map();
    const save = () => LS.set("larp-host-" + code, S);
    const who = (p) => (p.role ? "«" + p.role + "»" : p.name);
    const pushLog = (text) => { S.log.push({ at: Date.now(), text }); if (S.log.length > 80) S.log.shift(); };
    const n = () => S.players.length;
    const broadcast = () => {
      save();
      for (const [cid, pid] of connPid) HOST.t.send(cid, { t: "state", s: S, you: pid });
      if (HOST.localPid) onState(S, HOST.localPid);
    };
    const pts = (phase) => (phase === 2 ? Math.ceil(16 / n()) : Math.ceil(4 / n()) + 1);
    function advance() {
      if (S.phase === "lobby" || S.phase >= 5) return;
      S.phase += 1;
      S.players.forEach((p) => { p.ready = false; p.stuck = false; });
      if (S.phase === 2 || S.phase === 3) S.players.forEach((p) => (p.points += pts(S.phase)));
      if (S.phase === 3 && S.players.some((p) => ROLE(p.role)?.hopeReceiver)) S.hope.shown = true;
      pushLog("進入" + PHASE_NAME[S.phase]);
    }
    function checkAll() {
      if (typeof S.phase === "number" && S.phase <= 3 && n() > 0 && S.players.every((p) => p.ready)) advance();
      if (S.phase === 4 && S.players.every((p) => S.votes[p.pid])) { S.phase = 5; pushLog("投票結束"); }
    }
    function makePool() {
      const core = G.roles.filter((r) => r.core).map((r) => r.id);
      const opt = G.roles.filter((r) => !r.core).map((r) => r.id);
      const extra = n() - core.length;
      // 5 人加入第二個選配（沛綺）；6 人兩個都加
      return core.concat(extra >= 2 ? opt : extra === 1 ? [opt[opt.length - 1]] : []);
    }
    function dealRoles() {
      const ids = S.pool.slice(); for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
      S.players.forEach((x, i) => { x.role = ids[i]; x.ready = false; });
      const L = S.pool.slice(); for (let i = L.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [L[i], L[j]] = [L[j], L[i]]; }
      S.letters = {}; L.forEach((id, i) => (S.letters[id] = LETTERS[i])); S.names = {}; S.avatars = {};
    }
    function randFill() {
      const free = S.pool.filter((id) => !S.players.some((p) => p.role === id));
      for (let i = free.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [free[i], free[j]] = [free[j], free[i]]; }
      S.players.filter((p) => !p.role).forEach((p) => (p.role = free.shift()));
    }
    function apply(pid, a) {
      const p = S.players.find((x) => x.pid === pid); if (!p) return;
      const isHost = pid === S.hostPid;
      switch (a.k) {
        case "start":
          if (!isHost || S.phase !== "lobby" || n() < G.players.min || n() > G.players.max) return;
          S.pool = makePool(); dealRoles(); S.phase = "pick"; pushLog("角色已隨機分配，請替你的角色取名字"); break;
        case "reroll": if (isHost && S.phase === "pick") { dealRoles(); pushLog("開房者重新抽了角色"); } break;
        case "avatar": {
          if (S.phase !== "pick" || !p.role || !AV(a.av)) return;
          S.avatars = S.avatars || {};
          if (Object.entries(S.avatars).some(([rid, v]) => v === a.av && rid !== p.role)) return;
          S.avatars[p.role] = a.av; break;
        }
        case "name": {

    try { if (window.qrcode) { const q = qrcode(0, "M"); q.addData(link); q.make(); $("#qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } } catch (e) {}
    $("#copy").onclick = () => { const t = `一起來玩劇本殺《${G.title}》！\n${SHARE_BASE ? "打開連結後，輸入房間代號：" + S.code + "\n連結：" + link : "點連結加入：" + link + "\n或在首頁輸入房間代號：" + S.code}\n（${G.players.min}–${G.players.max} 人，無主持人，記得開語音）`; navigator.clipboard?.writeText(t).then(() => toast("已複製"), () => showCopyBox(t)); };
    const st = $("#start"); if (st) st.onclick = () => act({ k: "start" });
    $("#leave").onclick = leave;
  }

  function renderPick() {
    const S = VIEW.S, m = me(), isHost = VIEW.you === S.hostPid, r = ROLE(m.role);
    const my = S.names[m.role] || "";
    const others = S.pool.filter((id) => id !== m.role).map((id) => `<div class="row" style="flex-wrap:nowrap">${avatar(id, 40)}<div><b>${esc(charName(id))}</b>${S.names[id] ? "" : ' <span class="small muted">（還沒取名）</span>'}<div class="small muted">${esc(ROLE(id).oneLine)}</div></div></div>`).join("");
    app().innerHTML = `<div class="wrap stack">
      <div style="margin-top:12px"><h2>你抽到了 角色${esc(S.letters[m.role])}</h2><p class="small muted">角色是隨機分配的。替你的角色取一個名字，這個名字會出現在所有人的劇本、線索和結局裡。</p></div>
      <div class="pick mine" style="cursor:default">${avatar(m.role, 64)}<div class="pk-body"><div class="pk-name">${esc(charName(m.role))}</div><div class="small">${esc(r.oneLine)}</div></div></div>
      <label class="small muted">角色名字（最多 6 個字；不填就叫「角色${esc(S.letters[m.role])}」）</label>
      <div class="row" style="flex-wrap:nowrap"><input class="input" id="cn" maxlength="6" placeholder="例如：沈念" value="${esc(my)}"><button class="btn" id="cnok" style="white-space:nowrap">存名字</button></div>
      <div class="card stack"><div><b>選一個頭像</b><div class="small muted">只是外觀，跟角色身分無關。每個頭像一局只能一個人用。</div></div>
        <div class="avgrid">${(G.avatars || []).map((av) => { const owner = Object.entries(S.avatars || {}).find(([rid, v]) => v === av.id); const mine = owner && owner[0] === m.role; const dis = owner && !mine; return `<button class="avopt ${mine ? "on" : ""}" data-av="${av.id}" ${dis ? "disabled" : ""}>${avatarById(av.id, 48)}<span>${esc(av.label)}</span></button>`; }).join("")}</div></div>
      <div class="card stack"><div class="small muted">這一局的其他角色</div>${others}</div>
      <div class="card"><div class="row">${S.players.map((p) => `<span class="dot ${p.ready ? "ready" : ""} ${p.pid === VIEW.you ? "me" : ""}">${esc(p.name)}${p.ready ? " ✓" : ""}</span>`).join("")}</div></div>
      <button class="btn ${m.ready ? "ok" : "primary"} block" id="ready">${m.ready ? "已確定 ✓（再按取消）" : "確定，開始讀本"}</button>
      ${isHost ? `<button class="btn block" id="reroll">（開房者）重新抽角色</button><button class="btn ghost block small" id="force">（開房者）不等了，直接開始</button>` : ""}
      <p class="small center" style="color:var(--danger)" id="conn">${connState.s === "ok" ? "" : esc(connState.msg)}</p>
    </div>`;
    bind();
  }

  function leave() { if (!sure("確定離開這個房間？")) return; LS.del("larp-session"); location.href = location.pathname + (LOCAL ? "?local=1" : ""); }

  function viewBook() {
    const S = VIEW.S, r = ROLE(me().role);
    const actText = typeof S.phase === "number" && S.phase >= 1 && S.phase <= 3 ? r.acts[S.phase] : null;
    let h = "";
    if (S.phase === 0) h += sysBubble(G.system.acts[0]) + `<div class="card"><h2>序章</h2>${G.prologue.map((x) => `<p>${esc(x)}</p>`).join("")}</div>`;
    else if (S.phase <= 3) h += sysBubble(G.system.acts[S.phase]);
    if (actText) h += `<div class="act-prompt"><div class="small" style="color:var(--accent)">這一幕你可以做的事</div><div>${esc(actText)}</div></div>`;
    h += `<div class="paper row" style="flex-wrap:nowrap;align-items:center">${avatar(r.id, 72)}<div><div class="small" style="color:#7a6a4f">${esc(r.angle)}</div><h2 style="color:var(--ink);margin:0">${esc(r.name)}</h2><p style="color:#5a5044">${esc(r.oneLine)}</p></div></div>`;
    h += `<details class="card"><summary>其他角色</summary><div class="stack" style="margin-top:10px">${inGameRoles().filter((id) => id !== r.id).map((id) => `<div class="row" style="flex-wrap:nowrap">${avatar(id, 44)}<div><b>${esc(ROLE(id).name)}</b>（${esc(VIEW.S.players.find((p) => p.role === id)?.name || "")}）<div class="small muted">${esc(ROLE(id).oneLine)}</div></div></div>`).join("")}</div></details>`;
    h += `<label class="small muted">跳到段落</label><select class="input" id="jump">${r.sections.map((s, i) => `<option value="${i}">${i + 1}. ${esc(s.h)}</option>`).join("")}<option value="x">${r.sections.length + 1}. 各幕提示</option></select>`;
    h += r.sections.map((s, i) => `<div class="paper" id="sec${i}"><h3>${esc(s.h)}</h3><div class="pre">${esc(s.t)}</div></div>`).join("");
    h += `<div class="paper" id="secx"><h3>各幕提示</h3>${[1, 2, 3].map((k) => `<p><b>第${"一二三"[k - 1]}幕：</b>${esc(r.acts[k])}</p>`).join("")}</div>`;
    if (S.phase !== 0 && S.phase <= 3) h += `<details class="card"><summary>重看序章</summary>${G.prologue.map((x) => `<p class="small">${esc(x)}</p>`).join("")}</details>`;
    return h;
  }

  function viewSearch() {
    const S = VIEW.S, m = me();
    if (S.phase < 2) return sysBubble("第二幕才開始搜證。現在先自我介紹、聽聽大家怎麼說。") + hintBlock();
    let h = sysBubble(S.phase <= 3 ? `你還有 ${m.points} 點搜證點數。點一個地點，就會抽到那裡的下一張線索。` : "搜證已經結束。");
    h += G.locations.map((l) => {
      const left = l.clues.length - (S.deck[l.id] || 0);
      const locked = S.phase < l.act;
      const dis = locked || left <= 0 || m.points < 1 || S.phase > 3;
      const lk = LOC_LOOK[l.id] || ["pin", "a"];
      return `<div class="card loc ${locked ? "locked" : ""}"><span class="chip h-${lk[1]}">${window.ic(locked ? "lock" : lk[0])}</span><div style="flex:1"><div><b>${esc(l.name)}</b></div><div class="small muted">${locked ? "第三幕開放" : "剩 " + left + " 張"}</div></div><button class="btn ${dis ? "" : "primary"}" data-draw="${l.id}" ${dis ? "disabled" : ""}>${window.ic("search")}搜證</button></div>`;
    }).join("");
    h += hintBlock();
    return h;
  }

  function hintBlock() {
    const S = VIEW.S, m = me();
    if (typeof S.phase !== "number" || S.phase < 1 || S.phase > 3) return "";
    const stuck = S.players.filter((p) => p.stuck).length;
    let h = `<div class="card stack"><div class="row" style="justify-content:space-between"><b>卡關提示</b><span class="small muted">已解鎖 ${S.hints}/${G.hints.length}</span></div>`;
    h += G.hints.slice(0, S.hints).map((x, i) => `<div class="small">💡 ${i + 1}. ${esc(x)}</div>`).join("");
    if (S.hints < G.hints.length) h += `<button class="btn ${m.stuck ? "ok" : ""} block" id="stuck">${m.stuck ? "你按了「卡住了」（再按取消）" : "我們卡住了"}</button><div class="small muted">過半數的人按下，就會解鎖下一條提示（目前 ${stuck} 人）。</div>`;
    return h + `</div>`;
  }

  function clueCard(id, mine) {
    const S = VIEW.S, c = CLUE[id], st = S.clues[id], owner = S.players.find((p) => p.pid === st.by);
    let body = `<div class="pre">${esc(c.text)}</div>`;
    if (c.minigame === "rubbing") {
      body += st.rev ? `<div class="paper" style="margin-top:8px;background:#fbf7ee"><b>拓印出來的字：</b><br>${esc(c.reveal)}</div>`
        : mine ? `<div class="small" class="muted" style="margin-top:8px">用手指（或滑鼠）在下面來回塗抹，把壓痕拓印出來：</div><div class="rub" data-rub="${id}"><div class="under">${esc(c.reveal)}</div><canvas></canvas></div>`
        : `<div class="small" class="muted" style="margin-top:8px">（壓痕還沒有人拓印）</div>`;
    }
    return `<div class="clue ${st.pub ? "pub" : ""}"><div class="ev"><span class="evno">證物 ${String(CLUE_NO[id] || 0).padStart(2, "0")}</span><span>${esc(c.locName)}</span></div>${st.pub ? '<span class="stamp">已公開</span>' : ""}<div class="t">${esc(c.title)}</div>${body}
      <div class="meta">${st.pub ? "已公開・" : "只有你看得到・"}由 ${esc(owner?.name || "?")} 找到</div>
      ${mine && !st.pub ? `<button class="btn primary" style="margin-top:8px" data-pub="${id}">${window.ic("megaphone")}公開給大家</button>` : ""}</div>`;
  }

  function viewClues() {
    const S = VIEW.S;
    const ids = Object.keys(S.clues);
    const mine = ids.filter((id) => S.clues[id].by === VIEW.you);
    const pub = ids.filter((id) => S.clues[id].pub && S.clues[id].by !== VIEW.you);
    let h = `<h2>我的線索（${mine.length}）</h2>`;
    h += mine.length ? mine.map((id) => clueCard(id, true)).join("") : `<p class="muted">還沒有。到「搜證」抽線索。</p>`;
    h += `<h2 style="margin-top:12px">別人公開的線索（${pub.length}）</h2>`;
    h += pub.length ? pub.map((id) => clueCard(id, false)).join("") : `<p class="muted">還沒有人公開線索。</p>`;
    h += liveLog(S, 6);
    return h;
  }

  function viewTimeline() {
    const S = VIEW.S, notes = getNotes().sort((a, b) => a.time.localeCompare(b.time));
    const confL = ["不知道", "懷疑", "確定"];
    const form = (pfx) => `<div class="card stack"><div class="row"><input class="input" type="time" id="${pfx}t" style="max-width:130px" value="21:00"><select class="input" id="${pfx}c" style="max-width:120px"><option value="1">懷疑</option><option value="2">確定</option><option value="0">不知道</option></select></div>
      <textarea class="input" id="${pfx}x" rows="2" placeholder="誰、在哪、做了什麼？（我的推測）"></textarea><button class="btn primary" id="${pfx}add">加入</button></div>`;
    let h = `<h2>我的時間線筆記</h2><p class="small muted">只有你看得到。案發在週五晚上，把線索和推測按時間排起來，矛盾就會浮現。</p>` + form("p");
    h += `<div class="tl">${notes.map((e) => `<div class="it"><div class="tm">${esc(e.time)}</div><div><div class="pre">${esc(e.text)}</div><span class="conf c${e.conf}">${confL[e.conf]}</span></div><div class="stack" style="gap:4px">${S.phase >= 3 && S.phase <= 4 ? `<button class="btn small" data-share="${e.id}" title="公開到共享時間線">分享</button>` : ""}<button class="btn ghost small" data-pdel="${e.id}">✕</button></div></div>`).join("") || '<p class="muted small">還沒有筆記。</p>'}</div>`;
    h += `<h2 style="margin-top:18px">共享時間線</h2>`;
    if (S.phase < 3) h += `<p class="muted small">第三幕開放。到時候大家可以把推測放上來，看的是同一條時間線。</p>`;
    else {
      const sh = [...S.timeline].sort((a, b) => a.time.localeCompare(b.time));
      h += `<p class="small muted">所有人都看得到。</p>` + (S.phase <= 4 ? form("s") : "");
      h += `<div class="tl">${sh.map((e) => { const p = S.players.find((x) => x.pid === e.by); return `<div class="it"><div class="tm">${esc(e.time)}</div><div><div class="pre">${esc(e.text)}</div><span class="small muted">${esc(p?.name || "")}</span> <span class="conf c${e.conf}">${confL[e.conf]}</span></div>${e.by === VIEW.you ? `<button class="btn ghost small" data-sdel="${e.id}">✕</button>` : "<span></span>"}</div>`; }).join("") || '<p class="muted small">還沒有人分享。</p>'}</div>`;
    }
    return h;
  }

  function viewMsg() {
    const S = VIEW.S, r = ROLE(me().role);
    let h = sysBubble(G.system.greet);
    if (typeof S.phase === "number" && S.phase <= 4) h += sysBubble(G.system.acts[S.phase] || "");
    if (r.hopeReceiver && S.hope.shown) {
      h += `<div class="card stack"><div class="small muted">私訊・${esc(G.hope.from)}</div>${G.hope.messages.map((x) => `<div class="msg">${esc(x)}</div>`).join("")}`;
      if (S.hope.replied) h += `<div class="msg me">${esc(G.hope.replyText)}</div>${sysBubble(G.hope.systemTag)}`;
      else if (S.phase === 3) h += `<p class="small muted">回覆她會花掉 ${G.hope.replyCost} 點搜證點數。這件事跟破案無關。</p><button class="btn primary" id="hope" ${me().points < G.hope.replyCost ? "disabled" : ""}>回覆她${me().points < G.hope.replyCost ? "（點數不足）" : ""}</button>`;
      h += `</div>`;
    }
    h += `<div class="card stack"><div class="small muted">介面風格（只影響你自己的畫面）</div>${themePicker()}</div>`;
    h += liveLog(S, 10);
    if (VIEW.you === S.hostPid && typeof S.phase === "number" && S.phase <= 4) h += `<div class="card stack"><b>開房者工具</b><p class="small muted">有人斷線或離開、一直沒按準備好時使用。</p><button class="btn" id="force">強制進入下一幕</button></div>`;
    return h;
  }

  const VOTE = {};
  function viewVote() {
    const S = VIEW.S, voted = S.votes[VIEW.you];
    let h = sysBubble(G.system.acts[4]);
    if (voted) h += `<div class="card"><p>你已經投票了。等其他人…（${Object.keys(S.votes).length}/${S.players.length}）</p></div>`;
    else h += G.votes.map((q) => `<div class="card stack"><b>${esc(q.q)}</b><div class="vgrid">${inGameRoles().map((id) => `<button class="vopt ${VOTE[q.id] === id ? "on" : ""}" data-v="${q.id}:${id}">${avatar(id, 48)}<span>${esc(ROLE(id).name)}</span></button>`).join("")}</div></div>`).join("") + `<button class="btn primary block" id="vote">送出（無法更改）</button>`;
    h += viewTimelineMini();
    return h;
  }
  function viewTimelineMini() { const sh = [...VIEW.S.timeline].sort((a, b) => a.time.localeCompare(b.time)); return sh.length ? `<h3>共享時間線</h3><div class="tl">${sh.map((e) => `<div class="it"><div class="tm">${esc(e.time)}</div><div class="pre">${esc(e.text)}</div><span></span></div>`).join("")}</div>` : ""; }

  function result() {
    const S = VIEW.S; const tallies = {}; let ok = true;
    G.votes.forEach((q) => {
      const t = {}; Object.values(S.votes).forEach((v) => { t[v[q.id]] = (t[v[q.id]] || 0) + 1; });
      const max = Math.max(0, ...Object.values(t)); const tops = Object.keys(t).filter((k) => t[k] === max);
      tallies[q.id] = t; if (!(tops.length === 1 && tops[0] === q.answer)) ok = false;
    });
    return { ok, tallies };
  }

  function viewEnd() {
    const S = VIEW.S, { ok, tallies } = result(), e = ok ? G.endings.good : G.endings.bad;
    const fortune = e.fortune + (S.hope.replied ? G.endings.hopeFortuneBonus : 0);
    let h = `<div class="paper"><h2 style="color:var(--ink)">${esc(e.title)}</h2><div class="pre">${esc(e.text)}</div></div>`;
    h += G.votes.map((q) => `<div class="card"><b>${esc(q.q)}</b><div class="small">${Object.entries(tallies[q.id]).map(([k, v]) => esc(ROLE(k)?.name) + " " + v + " 票").join("・") || "沒有票"}</div><div class="small" style="color:var(--ok)">答案：${esc(ROLE(q.answer).name)}</div></div>`).join("");
    h += `<div class="card"><h2>真相</h2>${G.truth.map((x) => `<p>${esc(x)}</p>`).join("")}</div>`;
    if (S.hope.replied) h += `<div class="paper"><div class="pre">${esc(G.endings.hopeLine)}</div></div>`;
    h += `<div class="card"><h2>尾聲</h2>${inGameRoles().map((id) => `<div class="row" style="flex-wrap:nowrap;align-items:flex-start;margin:12px 0;${id === me().role ? "border-left:3px solid var(--accent);padding-left:10px" : ""}">${avatar(id, 44)}<div><b>${esc(ROLE(id).name)}</b><div class="pre small">${esc(G.epilogues[id])}</div></div></div>`).join("")}</div>`;
    h += `<div class="sys"><div class="av"></div><div><div class="nm">${esc(G.system.name)}</div><div>謝謝你們。今天辛苦了。</div><div class="glitch" style="margin-top:6px">${esc(G.system.glitch)} ${fortune}%。</div><div style="margin-top:6px">${esc(G.system.catchphrase)}</div></div></div>`;
    h += `<p class="center small muted" style="margin-top:20px">${esc(G.series)}　完</p><button class="btn ghost block" id="home">回首頁</button>`;
    return h;
  }

  // 推播橫幅：遊戲裡真的發生的事（公開線索、加入、投票⋯）像 App 通知一樣滑下來
  let SEEN_AT = null;
  function notifyNew(S) {
    const log = S.log || []; const last = log.length ? log[log.length - 1].at : 0;
    if (SEEN_AT === null) { SEEN_AT = last; return; }
    const fresh = log.filter((l) => l.at > SEEN_AT).slice(-2); SEEN_AT = Math.max(SEEN_AT, last);
    fresh.forEach((l, i) => setTimeout(() => pushBanner(l.text), i * 700));
  }
  function bannerIcon(t) { return /公開/.test(t) ? ["megaphone", "c"] : /找到/.test(t) ? ["search", "b"] : /加入/.test(t) ? ["user", "e"] : /投票/.test(t) ? ["vote", "d"] : /提示/.test(t) ? ["bulb", "a"] : ["repost", "a"]; }
  function pushBanner(text) {
    let box = document.getElementById("banners");
    if (!box) { box = document.createElement("div"); box.id = "banners"; document.body.appendChild(box); }
    const [icn, hue] = bannerIcon(T(text));
    const d = document.createElement("div"); d.className = "banner";
    d.innerHTML = `<span class="chip h-${hue}">${window.ic(icn)}</span><div class="bn-body"><div class="bn-hd"><b>小織</b><span>剛剛</span></div><div class="bn-tx"></div></div>`;
    d.querySelector(".bn-tx").textContent = T(text);
    box.prepend(d); while (box.children.length > 2) box.lastChild.remove();
    d.onclick = () => d.remove();
    setTimeout(() => { d.classList.add("out"); setTimeout(() => d.remove(), 400); }, 3800);
  }
  function render() {
    const S = VIEW.S; if (!S) return;
    notifyNew(S);
    if (S.phase === "lobby") return renderLobby();
    if (S.phase === "pick") { const c = $("#cn"); const d = c ? c.value : null; const f = c && document.activeElement === c; renderPick(); if (d !== null && $("#cn")) { $("#cn").value = d; if (f) $("#cn").focus(); } return; }
    if (!me() || !me().role) { app().innerHTML = `<div class="wrap"><p>等待中…</p></div>`; return; }
    document.body.classList.add("ingame");
    const keepScroll = window.scrollY;
    const views = { book: viewBook, search: viewSearch, clues: viewClues, tl: viewTimeline, msg: viewMsg, vote: viewVote, end: viewEnd };
    if ((VIEW.tab === "vote" && S.phase !== 4) || (VIEW.tab === "end" && S.phase !== 5)) VIEW.tab = "book";
    // 保留正在輸入的文字
    const drafts = {}; ["px", "sx", "pt", "st"].forEach((k) => { const el = $("#" + k); if (el) drafts[k] = el.value; });
    const vsel = {}; G.votes.forEach((q) => { const el = $("#v_" + q.id); if (el) vsel[q.id] = el.value; });
    app().innerHTML = topBar() + `<div class="wrap stack">${views[VIEW.tab]()}</div>` + tabsBar();
    Object.entries(drafts).forEach(([k, v]) => { const el = $("#" + k); if (el) el.value = v; });
    Object.entries(vsel).forEach(([k, v]) => { const el = $("#v_" + k); if (el) el.value = v; });
    window.scrollTo(0, keepScroll);
    bind();
  }

  function bind() {
    const S = VIEW.S;
    bindTheme();
    document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { VIEW.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));
    const rd = $("#ready"); if (rd) rd.onclick = () => { const c = $("#cn"); if (c && !me().ready && c.value.trim() !== (VIEW.S.names[me().role] || "")) act({ k: "name", name: c.value }); act({ k: "ready", v: !me().ready }); };
    const st = $("#stuck"); if (st) st.onclick = () => act({ k: "stuck" });
    const rr = $("#reroll"); if (rr) rr.onclick = () => { if (sure("重新抽會清掉大家取好的名字，確定？")) act({ k: "reroll" }); };
    document.querySelectorAll("[data-av]").forEach((b) => (b.onclick = () => act({ k: "avatar", av: b.dataset.av })));
    const cnok = $("#cnok"); if (cnok) cnok.onclick = () => { act({ k: "name", name: $("#cn").value }); toast("已儲存"); };
    const cn = $("#cn"); if (cn) cn.onkeydown = (e) => { if (e.key === "Enter") cnok.click(); };
    const fo = $("#force"); if (fo) fo.onclick = () => { if (sure("確定強制進入下一幕？")) act({ k: "force" }); };
    const hp = $("#hope"); if (hp) hp.onclick = () => act({ k: "hope" });
    const hm = $("#home"); if (hm) hm.onclick = () => { LS.del("larp-session"); location.href = location.pathname + (LOCAL ? "?local=1" : ""); };
    const jp = $("#jump"); if (jp) jp.onchange = () => { const el = $("#sec" + jp.value); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); };
    document.querySelectorAll("[data-draw]").forEach((b) => (b.onclick = () => { act({ k: "draw", loc: b.dataset.draw }); toast("抽到一張線索，到「線索」查看"); }));
    document.querySelectorAll("[data-pub]").forEach((b) => (b.onclick = () => { if (sure("公開後所有人都看得到，確定？")) act({ k: "pub", id: b.dataset.pub }); }));
    const addP = $("#padd"); if (addP) addP.onclick = () => { const x = $("#px").value.trim(); if (!x) return; const n = getNotes(); n.push({ id: uid(), time: $("#pt").value || "00:00", text: x, conf: +$("#pc").value }); setNotes(n); $("#px").value = ""; render(); };
    const addS = $("#sadd"); if (addS) addS.onclick = () => { const x = $("#sx").value.trim(); if (!x) return; act({ k: "tl_add", time: $("#st").value, text: x, conf: +$("#sc").value }); $("#sx").value = ""; };
    document.querySelectorAll("[data-pdel]").forEach((b) => (b.onclick = () => { setNotes(getNotes().filter((e) => e.id !== b.dataset.pdel)); render(); }));
    document.querySelectorAll("[data-share]").forEach((b) => (b.onclick = () => { const e = getNotes().find((x) => x.id === b.dataset.share); if (e) { act({ k: "tl_add", time: e.time, text: e.text, conf: e.conf }); toast("已分享到共享時間線"); } }));
    document.querySelectorAll("[data-sdel]").forEach((b) => (b.onclick = () => act({ k: "tl_del", id: b.dataset.sdel })));
    document.querySelectorAll("[data-v]").forEach((b) => (b.onclick = () => { const [q, id] = b.dataset.v.split(":"); VOTE[q] = id; render(); }));
    const vt = $("#vote"); if (vt) vt.onclick = () => { const v = {}; for (const q of G.votes) { v[q.id] = VOTE[q.id]; if (!v[q.id]) return toast("兩題都要選"); } if (sure("送出後無法更改，確定？")) act({ k: "vote", v }); };
    document.querySelectorAll("[data-rub]").forEach(initRub);
  }

  const RUBCV = {};
  function initRub(box) {
    const id = box.dataset.rub;
    if (RUBCV[id]) { box.replaceChild(RUBCV[id], box.querySelector("canvas")); return; }
    const cv = box.querySelector("canvas"); RUBCV[id] = cv;
    const r = box.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
    ctx.fillStyle = "#8d8577"; ctx.fillRect(0, 0, r.width, r.height);
    ctx.fillStyle = "#a39b8c"; for (let i = 0; i < 400; i++) ctx.fillRect(Math.random() * r.width, Math.random() * r.height, 2, 2);
    ctx.globalCompositeOperation = "destination-out";
    let down = false, strokes = 0;
    const pos = (e) => { const b = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return [t.clientX - b.left, t.clientY - b.top]; };
    const rub = (e) => { if (!down) return; e.preventDefault(); const [x, y] = pos(e); ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill(); strokes++; if (strokes % 20 === 0) check(); };
    const check = () => { const d = ctx.getImageData(0, 0, cv.width, cv.height).data; let clear = 0; for (let i = 3; i < d.length; i += 64) if (d[i] === 0) clear++; if (clear / (d.length / 64) > 0.55) { act({ k: "rev", id }); } };
    cv.addEventListener("pointerdown", (e) => { down = true; rub(e); });
    cv.addEventListener("pointermove", rub);
    window.addEventListener("pointerup", () => { if (down) check(); down = false; });
    cv.addEventListener("touchend", () => { check(); down = false; });
    cv.addEventListener("touchstart", (e) => { down = true; rub(e); }, { passive: false });
    cv.addEventListener("touchmove", rub, { passive: false });
  }

  /* ---------------- boot ---------------- */
  function boot() {
    applyTheme(LS.get("larp-theme", "glass"));
    const room = (params.get("room") || "").toUpperCase();
    const sess = LS.get("larp-session");
    if (room && sess && sess.code === room && sess.name) return goRoom(room, sess.name, sess.host);
    renderHome();
  }
  window.__LARP = { VIEW, get HOST() { return HOST; } };
  boot();
})();
</script>
</body></html>
